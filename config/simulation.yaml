# ── Product penetration (probability of purchasing at least once) ─────────────
penetration:
  Strata:   0.55
  SASE:     0.22
  Prisma:   0.18
  Cortex:   0.20
  Support:  0.40   # conditional on having a supported product
  Services: 0.08

# ── Term length mix (by size segment) ─────────────────────────────────────────
term_mix:
  smb:              {yr1: 0.70, yr2: 0.20, yr3: 0.10}
  midmarket:        {yr1: 0.45, yr2: 0.35, yr3: 0.20}
  enterprise:       {yr1: 0.25, yr2: 0.35, yr3: 0.40}
  large_enterprise: {yr1: 0.15, yr2: 0.30, yr3: 0.55}

# ── Subscription cancellation rates (annual, per subscription line) ───────────
# These are subscription-level annual cancellation anchors, not logo churn.
# Calibrated to PANW-like retention: ~120% NRR, 3-5% enterprise logo churn.
# Archetype relative-risk multipliers (churn_risk_weights / pop-weighted avg)
# shift each account's probability from this anchor; weighted avg stays at base.
# Ref: PANW FY2025 120% NRR; enterprise security benchmark 4-8% annual churn.
subscription_cancellation_rate:
  smb:              0.08   # cybersec SMB (50-499 emp); sticky product but some switching
  midmarket:        0.05   # 500-4999 emp; moderate; budget cycles drive some loss
  enterprise:       0.025  # 5000-49999 emp; platform stickiness strong; ~2.5%/yr
  large_enterprise: 0.01   # 50000+ emp; near-zero logo churn at PANW scale; ~1%/yr
  # Weighted avg (45/35/18/2% mix): ~5.7% — consistent with PANW 120% NRR / ~95% GRR

# ── Dirty data injection rates ────────────────────────────────────────────────
dirty_data:
  duplicate_order_rate:          0.015   # duplicates injected as exact field copies
  inconsistent_product_id_rate:  0.020   # random-case product_id on items
  missing_team_mapping_rate:     0.030   # null owner_team_id on items
  invalid_date_rate:             0.010   # unparseable order_date strings
  late_telemetry_rate:           0.000   # main scenario: reliable reporting; set >0 for stress tests
  missing_telemetry_rate:        0.000   # main scenario: reliable reporting; set >0 for stress tests
  missing_interactions_rate:     0.05    # 5% of interactions may have missing owner fields after handoff

# ── Deployment scope expansion by billing unit ─────────────────────────────────
# scope_targets = licensed_units × Uniform(1.0, expansion_max).
# For infrastructure products the network/environment to protect is larger than
# the licensed capacity, so coverage < 100% even at full utilization.
# For seat/user products the scope equals the licensed count exactly (ratio = 1.0).
# These are simulation design assumptions, not measured PANW deployment data.
scope_expansion_by_billing_unit:
  user:          1.0   # seat-based: scope equals licensed capacity
  endpoint:      1.0   # endpoint count equals licensed
  operator_seat: 1.0   # operator seats are the deployment unit
  app:           1.0   # app count equals licensed
  engagement:    1.0   # professional services engagements
  pct_net_acv:   1.0   # support products (ACV-based, not unit-count)
  device:        1.5   # network has more devices than licensed firewalls
  vcpu:          1.5   # virtualized environment larger than licensed capacity
  credit:        1.3   # credit-based consumption; budget > immediate spend
  mbps:          1.4   # available bandwidth may exceed licensed throughput
  cloud_account: 1.3   # cloud accounts can exceed monitored scope
  workload:      1.5   # more workloads exist than are protected
  tb:            1.4   # data volume can exceed licensed DSPM capacity
  tb_ingest:     1.3   # log volume can exceed licensed SIEM capacity
  asset:         1.6   # attack surface larger than what is monitored

# ── Deployment behavioral archetype mix ───────────────────────────────────────
# sensor_outage removed from main archetype list; its 0.05 weight moved to healthy_steady.
deployment_archetypes:
  healthy_steady:       0.43
  delayed_onboarding:   0.12
  gradual_abandonment:  0.10
  workload_growth:      0.08
  workload_shrinkage:   0.06
  seasonal:             0.05
  failed_deployment:    0.04
  platform_migration:   0.04
  champion_turnover:    0.04
  budget_pressure:      0.04

# Customer experience state parameters (forward simulation)
# These drive renewal probability via logistic function
experience_weights:
  deployment_gap_weight:    0.35  # incomplete deployment reach increases risk
  value_decline_weight:     0.30  # declining productive use increases risk
  service_problem_weight:   0.25  # unresolved customer impact increases risk
  commercial_pressure_weight: 0.10  # price shock / budget concern increases risk

# Renewal quote timing
quote_lead_days: 120  # quotes issued ~120 days before term_end
quote_update_window_days: 30  # quotes may be updated within 30 days of issuance

# ── Commercial decision weights (drawn after operational signals) ─────────────
# These are simulation assumptions, not calibrated PANW coefficients
churn_risk_weights:
  gradual_abandonment:  0.65   # archetype → elevated churn probability (strengthened for signal clarity)
  failed_deployment:    0.75
  budget_pressure:      0.45
  champion_turnover:    0.30
  healthy_steady:       0.03
  delayed_onboarding:   0.12
  workload_growth:      0.03
  workload_shrinkage:   0.15
  seasonal:             0.06
  platform_migration:   0.08

# ── Telemetry / deployments ───────────────────────────────────────────────────
# avg_active_deployments: 100,000 planning assumption (conservative)
# Weekly obs: ~100k deps × ~260 weeks = ~26M rows; real output follows lifetimes
telemetry_batch_size: 5000

# ── Dev-mode overrides ────────────────────────────────────────────────────────
dev_overrides:
  company_count: 2000

# ── Expected output files (consumed by downstream pipeline stages) ─────────────
# generate_data.py hashes these files; ingest_clean.py verifies the hashes.
# Expected: products.csv, parent_orgs.csv, companies.csv, teams.csv, users.csv,
#           orders.csv, order_items.csv, deployments.csv, telemetry_weekly.csv,
#           support_tickets.csv, contract_events.csv, entitlement_deployment_map.csv,
#           deployment_team_map.csv, account_interactions.csv, renewal_quotes.csv
# Note: deployments_prelim.csv is intermediate only and NOT in the hash manifest.

# Separate, disclosed model-demonstration scenario. See frozen_design.md.
# These coefficients are assumptions, not estimates of PANW customer behavior.
experience_scenario:
  enabled: true
  version: "interaction_demo_v1"
  reference_population: 20000
  shared_coverage_weight: 0.75
  deployment_value_failure: 3.2
  deterioration_with_incomplete_reach: 2.2
  commercial_value_conflict: 1.2
  service_with_deployment_problem: 0.8
