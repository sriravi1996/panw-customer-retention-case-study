# Simulation configuration — Part 1 (corrected v2)
# All parameters documented in docs/simulation_assumptions.md
# Correction plan: Part_1_Corrections_and_Engagement_Plan.pdf

seed: 137

# ── Time window (5-year observation) ─────────────────────────────────────────
observation_start:    "2021-10-01"
observation_end:      "2026-10-01"
scoring_date:         "2026-10-01"
# Historical evaluation snapshots with complete 90-day forward windows
historical_scoring_dates:
  - "2023-10-01"   # training cohort A: 2yr lookback; labels mature 2023-12-30
  - "2024-10-01"   # training cohort B: 3yr lookback; labels mature 2024-12-30
  - "2025-04-01"   # model/threshold selection: expiry ≤2025-06-30; labels mature 2025-09-28
  - "2025-07-01"   # additional training; labels mature 2025-09-29
  - "2025-10-01"   # calibration cohort: expiry ≤2025-12-31; labels mature 2026-03-31
  - "2026-04-01"   # FINAL TEST (sealed): expiry ≤2026-06-30; labels mature 2026-09-28
  # 2026-07-01 intentionally omitted: only 14 rows matured, all negative — invalid test set
label_window_days: 90
outcome_window_days: 90
renewal_grace_period_days: 30
# Opening installed base: customers whose first purchase predates observation_start
opening_base_start: "2018-10-01"   # up to 3yr pre-history for established customers

# ── Scale (conservative scenario) ─────────────────────────────────────────────
company_count: 10000          # mid-scale run
# company_count: 70000        # full-scale conservative baseline
# company_count: 2000         # dev mode (uncomment to use)
dev_mode: false

# Parent org hierarchy: some parents have multiple purchasing accounts
parent_org_share_multi_account: 0.15   # 15% of parents have 2-4 accounts
avg_accounts_per_multi_parent: 2.4

avg_users_per_account: 3.0            # ~210k contacts total
avg_teams_per_account: 1.5            # ~105k teams total; enterprise tail allowed
history_months: 60                    # 5 years

